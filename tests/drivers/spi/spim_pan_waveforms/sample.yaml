sample:
  name: SPIM workaround waveforms
tests:
  drivers.spim_pan_waveforms:
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
  drivers.spim_pan_waveforms.no_workaround:
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
    extra_args:
      - -DCONFIG_SPIM_WORKAROUND_FORCE_OFF=y
